name: Update IPMA observations

on:
  schedule:
    - cron: "17 2/14 * * *" # Daily at 02:17 14:07 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipma-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download, update and publish database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="ipma-data"
          db="$RUNNER_TEMP/ipma_observations.sqlite3"
          backup="$RUNNER_TEMP/ipma_observations.backup.sqlite3"

          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ipma_observations.sqlite3" \
            --dir "$RUNNER_TEMP"

          test -s "$db"
          cp "$db" "$backup"

          python3 ipma/ipma_observations_to_sqlite.py --db "$db"

          python3 -c '
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              result = db.execute("PRAGMA integrity_check").fetchone()[0]
          if result != "ok":
              sys.exit(f"Database integrity check failed: {result}")
          ' "$db"

          gh release upload "$tag" "$backup" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$tag" "$db" \
            --repo "$GITHUB_REPOSITORY" --clobber
